name: E2E Smoke (Playwright)

on:
  push:
    branches: ["main", "chore/github-bootstrap"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright setup exists
        run: |
          CONFIG_OK=false
          SCRIPT_OK=false

          if [ -f "apps/web/playwright.config.ts" ] || [ -f "playwright.config.ts" ]; then
            CONFIG_OK=true
          fi

          if [ -f "apps/web/package.json" ]; then
            if grep -qE '"@playwright/test"|"e2e":\s*"playwright' apps/web/package.json; then
              SCRIPT_OK=true
            fi
          fi

          if [ -f "package.json" ]; then
            if grep -qE '"@playwright/test"|"e2e":' package.json; then
              SCRIPT_OK=true
            fi
          fi

          if [ "$CONFIG_OK" != true ] || [ "$SCRIPT_OK" != true ]; then
            echo "Playwright non è ancora configurato correttamente."
            echo "Serve almeno:"
            echo "- playwright.config.ts"
            echo "- script/test command Playwright nel package.json"
            exit 1
          fi

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps

      - name: Run E2E Smoke Tests
        env:
          NEXT_PUBLIC_POSTHOG_API_KEY: phc_ci_test_key
          POSTHOG_API_KEY: phc_ci_test_key
          # E2E writes quote requests and edits prices: point E2E_* secrets at a dedicated
          # Supabase instance. Falls back to the shared secrets until those exist.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm e2e
